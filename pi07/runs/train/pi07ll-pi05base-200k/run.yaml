id: pi07ll-pi05base-200k
kind: train
stack: pi07
task: 18 tasks (17 cooking + clean_a_keyboard)
status: running
date: '2026-09-20'
base_model: models/pi05_base (lerobot/pi05_base, openpi π0.5 base 의 PyTorch 포트)
max_steps: 200000
launcher: >-
  PI07_MEM_MAX=26G src/pi07/launch.sh pi07ll-pi05base-200k 0,1 ll 200000 --micro-batch 16 --accum 1 --goal-per-micro 4
  --warmup 1000 --workers 4 --save-every 2000 --val-every 2000 --milestone 10000
unit: systemd --user pi07ll-pi05base-200k (GPU 0+1 torchrun 2 rank, MemoryMax 26G, MemorySwapMax 8G, Restart=on-failure)
desc: >-
  pi07ll-pi05base-30k 과 레시피가 같고 스텝만 30k → 200k. 10k/20k/30k 체크포인트에서 잰 멱법칙
  (전체 L1, subtask 민감도) 이 포화 없이 이어지는지, 그리고 지시:잡음 비(subtask 민감도 : 잡음 민감도)가
  1 을 넘는지를 검정한다 (측정은 src/analysis/probe_pi07_ll.py). 처음부터 다시 돌린다 — 30k 에서 이어 붙이면
  코사인 일정이 끊겨 "스텝 수 효과"와 "일정 재시작 효과"가 섞인다.
dataset: data/pi07 (src/pi07/build_index.py) — 3,420 train / 180 val 에피소드, 35,957,659 train 프레임
parallel: >-
  데이터 병렬 2 rank (torchrun). rank 마다 micro-batch 16 (nogoal 12 + goal 4), accum 1 →
  유효 배치 32 로 30k 실행과 같다. 그래디언트는 평탄화 all-reduce 후 평균, clip 1.0 은 평균 뒤에 건다.
  rank 별 데이터 시드가 달라 표본이 겹치지 않는다. 검증·체크포인트는 rank 0, 나머지는 barrier 대기.
effective_batch: 32
optimizer: AdamW(0.9, 0.95, wd 0.01), lr 2.5e-5 → 2.5e-6 cosine, warmup 1000, grad clip 1.0
action_horizon: 50
image_size: 224
denoise_steps_inference: 5
state: 25-dim, π0.5 식 256구간 텍스트 토큰
normalization: q01/q99 → [-1, 1] (data/pi07/stats.json)
prompt_dropout: 30k 실행과 동일 (서브골 25% · subtask 30%/10% · 메타 15%/5%)
throughput_smoke: 1.74 s/step (2 GPU, 2026-09-20 스모크 12스텝). 단일 GPU 3.33 s/step 대비 1.91배
eta_h: 97
