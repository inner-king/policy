id: pi07hl-pi05base-8k
kind: train
stack: pi07
task: 18 tasks (17 cooking + clean_a_keyboard)
status: done
date: '2026-09-18'
base_model: models/pi05_base 의 PaliGemma (SigLIP 400M + Gemma 2B), action expert 제외
max_steps: 8000
launcher: src/pi07/launch.sh pi07hl-pi05base-8k 1 hl 8000 --micro-batch 16 --accum 2 --warmup 300 --workers 4 --save-every 500 --val-every 1000 --milestone 2000
unit: systemd --user pi07hl-pi05base-8k (GPU1, MemoryMax 18G, MemorySwapMax 8G, Restart=on-failure)
desc: >-
  π0.7 재현의 고수준 정책. (3뷰 관측, 태스크 문장, 지시 이력 최대 8개) → 지금 유효해야 할 subtask 문장.
  이력 = 직전 질의 시점(t − Δ, Δ ~ U[0.5,1.5]초)까지 내려진 지시 (그 시점의 지시 포함) — 런타임에서
  HL 이 자기 직전 출력을 이력 끝에 두고 유지/전환을 판단하는 것과 같은 정의.
  B1K 스킬 주석 94,438 세그먼트를 src/pi07/subtask_text.py 로 영어 명령문(540종)으로 바꿔 정답으로 쓴다.
  PaliGemma 언어 모델 18층 × 7개 선형층에 LoRA(r=32, α=32, dropout 0.05) = 39.2M 학습.
dataset: data/pi07 — 3,420 train / 180 val 에피소드
effective_batch: 32            # 마이크로배치 16 × 누적 2
sampling: >-
  프레임의 50% 는 에피소드 균등, 50% 는 세그먼트 경계 ±1.5초. 이력 드롭아웃 10% ("unknown").
  학습 표본의 20.0% 가 전환(이력의 마지막 ≠ 정답).
optimizer: AdamW(0.9, 0.95, wd 0.01), lr 1e-4 → 1e-5 cosine, warmup 300
prompt: >-
  "Task: {instruction} Subtask history: {h1; …; h_last}. Current subtask:" → " {subtask}<eos>"
val: >-
  검증 에피소드 180개, Δ=1초. 1초 격자 균등 256 + 경계 직후 0~1초 64 + 경계 직전 0~1초 64 = 384 고정,
  탐욕 생성 exact match. 전환 표본 76개. 기준선 "이력의 마지막 지시 유지" = 0.802 (이 혼합),
  균등 부분만이면 0.9375. HL 은 이것을 넘고 val_exact_switch 가 0 보다 커야 쓸모가 있다.
deviations_from_paper: >-
  π0.7 HL 은 π0.7 자체(Gemma3 4B)를 사람 코칭 데이터로 파인튜닝한다. 여기서는 LL 과 같은 π0.5 base
  VLM 에 LoRA, 정답은 오프라인 세그먼트 주석. 이력은 정답 이력으로 학습 (추론 시에는 자기 출력).
history_of_run: >-
  12:49 첫 시도는 이력을 "현재 세그먼트 이전까지"로 정의했다 — 런타임에서 이력은 HL 이 전환해야만
  늘어나므로 그 정의로는 전환 신호가 학습에 없다 (이미지 없이 이력 bigram 만으로 val 0.791).
  94 스텝에서 멈추고 지우고 13:05 에 같은 id 로 다시 걸었다.
throughput_smoke: 6.8–8.6 s/step (3090), GPU 12–13 GB, 메인 1.8 GB + 워커 3개 1.6 GB
