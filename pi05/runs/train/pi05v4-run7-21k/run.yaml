hardware: Colab A100 80GB, XLA_PYTHON_CLIENT_MEM_FRACTION=0.97 (VRAM 최대 73.9 GiB)
sec_per_step: 3.5
wallclock: 기록 없음
checkpoint_used: pi05_cooking_top20_v4/run8/18000  # 20999 는 목차 파일이 빠져 열리지 않는다
command: 기록 없음  # 인자 구성은 README '학습' 의 명령과 같고, 값은 위 필드와 같다
notes:
  - v3 대비 바꾼 것은 freeze_filter 하나: SigLIP 만 얼리고 Gemma 2B 본체까지 학습 (학습 2,988.6M).
  - 체크포인트 하나 46.1 GiB. 세션 끝 여유(30분)가 Drive 업로드(약 68분)보다 짧아 마지막 저장을 잃었다.
  - 저장 간격 인자는 기록 없음 (15000·18000 이 남아 있다).
