# pi05 학습 실행 기록 — 무엇을 어떻게 돌렸는지만 적는다. 결과는 이슈에 있다.
run_id: pi05v4-run7-21k
original_name: run8          # 원래 저장소의 실행 이름. 체크포인트 경로는 <설정>/<run>/<스텝>
config: pi05_cooking_top20_v4        # src/configs/cooking_config.py (v4)
