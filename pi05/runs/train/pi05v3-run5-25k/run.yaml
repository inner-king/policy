# pi05 학습 실행 기록 — 무엇을 어떻게 돌렸는지만 적는다. 결과는 이슈에 있다.
run_id: pi05v3-run5-25k
original_name: run6          # 원래 저장소의 실행 이름. 체크포인트 경로는 <설정>/<run>/<스텝>
config: pi05_cooking_top20_v3        # src/configs/cooking_config.py (v3)
init_weights: pi05_cooking_top20_v3/run5/12499/params
init_weights_env: COOKING_INIT_PARAMS   # 이 환경변수로 경로를 넘긴다. 옵티마이저 상태는 새로 시작한다
steps: 25000  # 계획 27,000. 26,500 까지 돌았으나 마지막 세 번의 저장이 Drive 에 다 올라가지 못했다
batch_size: 32
seed: 45
optimizer: {type: AdamW, b1: 0.9, b2: 0.95, eps: 1.0e-8, weight_decay: 1.0e-10, clip_gradient_norm: 1.0}   # openpi 기본값
lr_schedule: {type: cosine, warmup_steps: 1000, peak_lr: 1.0e-4, decay_steps: 27000, decay_lr: 5.0e-6}
ema_decay: 0.99
num_flow_samples: 8
instructions: 20  # TOP20, 상한 10만
hardware: Colab Pro+ A100 40GB (24시간 세션)
sec_per_step: 3.0
wallclock: 23.2 h (26,500 스텝까지)
checkpoint_used: pi05_cooking_top20_v3/run6/25000
command: 기록 없음  # 인자 구성은 README '학습' 의 명령과 같고, 값은 위 필드와 같다
notes:
  - 설정은 5차와 같다. 3~6차 누적 61,500 스텝 = TOP20 표본 수 기준 1.01 에폭.
  - 저장 간격 인자는 기록 없음.
