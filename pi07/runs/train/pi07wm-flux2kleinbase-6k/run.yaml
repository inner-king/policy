# 이 실행이 무엇이었는지의 단일 출처. 표·문서의 수치는 여기서 유도된다.
# 공개 저장소용 사본: 셋업(무엇을 어떻게 돌렸는지)만 남겼다. 결과 수치는 GitHub issue 에 따로 올린다.
id: pi07wm-flux2kleinbase-6k
kind: train
stack: pi07
task: 18 tasks (17 cooking + clean_a_keyboard)
status: done                 # pi07hl-pi05base-8k 가 COMPLETED 를 쓰면 pi07-chain-wm 유닛이 GPU1 에서 띄운다
date: '2026-09-18'
base_model: models/flux2_klein_base_4b (black-forest-labs/FLUX.2-klein-base-4B, Apache-2.0, 증류 안 된 base)
max_steps: 6000
launcher: >-
  systemd-run --user --unit=pi07-chain-wm --working-directory=$CAPSTONE bash src/pi07/chain.sh pi07hl-pi05base-8k pi07wm-flux2kleinbase-6k
  1 wm 6000 --micro-batch 8 --accum 2 --warmup 300 --workers 3 --save-every 500 --val-every 1000 --milestone 2000
desc: >-
  π0.7 재현의 서브골 월드 모델 (π0.7 V-B, App.C 의 BAGEL-14B 자리). (현재 3뷰, 태스크, subtask) →
  세그먼트 끝 3뷰. 3뷰를 머리|왼손목|오른손목으로 이은 672×224 한 장, 현재 타일을 FLUX.2 참조 이미지(T=10)로.
  트랜스포머 LoRA r64 = 96.3M 학습, VAE·텍스트 인코더 동결. 텍스트는 Qwen3 층 9/18/27 캐시(671문장, 64토큰).
effective_batch: 16            # 마이크로배치 8 × 누적 2
optimizer: AdamW(0.9, 0.95, wd 0.01), lr 1e-4 → 1e-5 cosine, warmup 300
noise_schedule: logit-normal σ + FLUX.2 empirical mu shift (seq 588), 10% 빈 문장 (CFG)
val: >-
  검증 에피소드 32표본 고정. σ∈{0.25,0.5,0.75} 고정 잡음 손실 + 첫 배치 8장 생성(28스텝, CFG 4.0) PSNR.
  기준선 = 현재 관측을 그대로 서브골로 쓰는 것(복사) 의 PSNR. runs/train/<id>/val/step-*.png 에 (현재|생성|정답) 격자.
deviations_from_paper: >-
  BAGEL-14B → FLUX.2 klein base 4B + LoRA (24 GB 한 장 제약). 뷰당 224×224 (π0.7 512×384).
  메타데이터 조건 없음. 웹·사람 영상 데이터 없음 (B1K 데모만).
throughput_smoke: >-
  3090: 배치 8 에서 3.7–4.6 s/step, 배치 12 에서 5.5–6.8 s/step (둘 다 표본당 약 0.5 s). GPU 최대 16.1 GB (배치 12).
  메인 RssAnon 1.4 GB, 워커 3개 0.9 GB. 검증 1회 129 s.
